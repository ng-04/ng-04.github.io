<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comic Storybook Maker</title>
  <meta name="description" content="Turn your family into the heroes of a printable comic storybook.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23FFD93B'/%3E%3Ctext x='50' y='64' font-family='Impact,sans-serif' font-size='40' text-anchor='middle' fill='%23FF4A3D' stroke='%23141414' stroke-width='2'%3EPOW%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <h1 class="app-title no-print">Comic Storybook Maker</h1>

    <!-- Screen 1: inputs -->
    <form id="form-screen" class="card form" novalidate>
      <div class="grid">
        <label class="field">Hero's name
          <input name="hero" value="Avyay">
        </label>
        <label class="field">Hero's age
          <input name="age" value="4">
        </label>
        <label class="field">Hero is a
          <select name="gender">
            <option value="boy">Boy</option>
            <option value="girl">Girl</option>
            <option value="child">Keep neutral</option>
          </select>
        </label>
        <label class="field">Other characters
          <input name="others" value="baby brother Rudrav (newborn), Mama, Papa"
                 placeholder="e.g. baby brother Rudrav, Mama, Papa">
        </label>
      </div>

      <label class="field">Story idea
        <textarea name="idea" rows="3">A new baby brother is born. Avyay is excited and becomes Super Big Brother with a cape and super powers: hugging, singing, protecting.</textarea>
      </label>

      <div class="grid">
        <label class="field">Tone
          <select name="tone">
            <option>Superhero action</option>
            <option>Funny</option>
            <option>Heartwarming</option>
            <option>Adventurous</option>
            <option>Gentle bedtime</option>
          </select>
        </label>
        <label class="field">Pages
          <select name="pages">
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="12" selected>12</option>
          </select>
        </label>
      </div>

      <div class="field">
        <span>Family photo (keeps characters looking like them)</span>
        <div class="photo-row">
          <label class="btn btn-yellow">Choose photo
            <input id="photo-input" type="file" accept="image/*" hidden>
          </label>
          <img id="photo-preview" class="photo-preview" alt="Selected family photo" hidden>
        </div>
      </div>

      <div class="keys">
        <label class="field">Anthropic API key (writes the story)
          <input name="anthropicKey" type="password" class="mono" autocomplete="off"
                 placeholder="sk-ant-...">
        </label>
        <label class="field">Gemini API key (draws the pictures)
          <input name="geminiKey" type="password" class="mono" autocomplete="off"
                 placeholder="Paste key from Google AI Studio">
        </label>
        <p class="hint">Keys are saved only in this browser (localStorage) and sent straight to Anthropic and Google.
          Leave the Gemini key blank to get the story with image prompts instead of pictures.</p>
      </div>

      <div id="form-error" class="error" role="alert" hidden></div>

      <button type="submit" class="btn-big">Make my comic!</button>
    </form>

    <!-- Screen 2: writing -->
    <section id="writing-screen" class="card writing" hidden>
      <div class="spinner"></div>
      <div class="writing-label">Writing the story...</div>
    </section>

    <!-- Screen 3: comic -->
    <section id="comic-screen" class="comic" hidden>
      <div class="toolbar no-print">
        <button type="button" class="btn" id="edit-btn">Edit inputs</button>
        <button type="button" class="btn" id="new-btn">New story</button>
        <div id="progress" class="progress"></div>
        <button type="button" class="btn btn-yellow btn-shadow" id="pdf-btn">Download PDF</button>
      </div>
      <div id="panels" class="panels"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
